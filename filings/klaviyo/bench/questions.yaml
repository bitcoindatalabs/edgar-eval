# ---------------------------------------------------------------- governance / risk (4)

- id: ticker-exchange
  category: governance
  question: On which exchange and under what ticker symbol has Klaviyo applied to list its Series A common stock?
  kind: text
  must_include: [KVYO, New York Stock Exchange]
  accept_alias: {New York Stock Exchange: [NYSE]}
  trap: Saying Nasdaq.
  quote: "on the New York Stock Exchange under the symbol “KVYO”"

- id: underwriter-representatives
  category: governance
  question: Which firms are acting as the representatives of the underwriters (lead underwriters) for Klaviyo's IPO?
  kind: text
  must_include: [Goldman Sachs, Morgan Stanley, Citigroup]
  accept_alias: {Citigroup: [Citi], Goldman Sachs: [Goldman]}
  trap: Listing the full underwriting syndicate, or omitting Citigroup.
  quote: "Goldman Sachs & Co. LLC, Morgan Stanley & Co. LLC and Citigroup Global Markets Inc. are the representatives of the underwriters"

