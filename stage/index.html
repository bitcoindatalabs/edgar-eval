<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stump the Model · Stage</title>
<style>
:root {
  color-scheme: dark;
  --bg: #121211; --surface-1: #1a1a19; --surface-2: #232321; --border: #33332f;
  --text-primary: #ffffff; --text-secondary: #c3c2b7; --text-muted: #8f8e86;
  --accent: #d95926; --good: #0ca30c; --critical: #e66767; --warning: #fab219;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text-primary); font: 17px/1.45 ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif; }
.wrap { display: grid; grid-template-columns: 340px 1fr; gap: 20px; padding: 20px; min-height: 100vh; }
@media (max-width: 900px) { .wrap { grid-template-columns: 1fr; } }
.side, .main { min-width: 0; }
h1 { font-size: 30px; margin: 0 0 2px; letter-spacing: -.02em; }
h1 span { color: var(--accent); }
.sub { color: var(--text-secondary); font-size: 14px; margin-bottom: 16px; }
.panel { background: var(--surface-1); border: 1px solid var(--border); border-radius: 14px; padding: 14px; margin-bottom: 16px; }
.panel h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--text-secondary); margin: 0 0 10px; display: flex; justify-content: space-between; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--text-muted); display: inline-block; margin-right: 6px; }
.dot.live { background: var(--good); box-shadow: 0 0 8px var(--good); }
.qitem { padding: 10px; border-radius: 10px; background: var(--surface-2); margin-bottom: 8px; cursor: pointer; border: 1px solid transparent; }
.qitem:hover { border-color: var(--accent); }
.qitem.asked { opacity: .45; }
.qitem .who { font-size: 13px; color: var(--accent); font-weight: 600; }
.qitem .txt { font-size: 15px; }
textarea { width: 100%; font: inherit; font-size: 15px; background: var(--surface-2); color: var(--text-primary); border: 1px solid var(--border); border-radius: 10px; padding: 8px 10px; min-height: 70px; }
button { font: inherit; font-weight: 600; border: 0; border-radius: 10px; padding: 9px 14px; cursor: pointer; background: var(--surface-2); color: var(--text-primary); }
button.primary { background: var(--accent); color: #fff; }
.question { font-size: 30px; font-weight: 650; line-height: 1.2; margin: 6px 0 4px; letter-spacing: -.01em; }
.asker { color: var(--accent); font-weight: 600; margin-bottom: 18px; }
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 14px; }
.card { background: var(--surface-1); border: 1px solid var(--border); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.card .name { font-weight: 700; font-size: 19px; display: flex; justify-content: space-between; align-items: center; }
.meta { color: var(--text-muted); font-size: 13px; font-variant-numeric: tabular-nums; }
.ans { font-size: 19px; }
.quote { font-size: 14px; color: var(--text-secondary); border-left: 3px solid var(--border); padding-left: 10px; }
.badge { font-size: 13px; font-weight: 700; padding: 2px 10px; border-radius: 99px; background: var(--surface-2); }
.ok { color: var(--good); } .bad { color: var(--critical); } .warn { color: var(--warning); }
.spinner { width: 22px; height: 22px; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: s 0.9s linear infinite; }
@keyframes s { to { transform: rotate(360deg); } }
.verdict { display: flex; gap: 8px; margin-top: 18px; flex-wrap: wrap; }
.winner { font-size: 15px; padding: 6px 0; border-bottom: 1px solid var(--border); }
.empty { color: var(--text-muted); font-size: 15px; padding: 8px 0; }
.hero-empty { color: var(--text-muted); font-size: 22px; padding: 80px 0; text-align: center; }
</style>
</head>
<body>
<div class="wrap">
  <aside class="side">
    <h1>Stump the <span>model</span></h1>
    <div class="sub">Pay 21 sats, ask about the S-1. Beat the top model, win sats.</div>

    <div class="panel">
      <h2><span><i class="dot" id="live"></i>Paid questions</span><span id="qcount">0</span></h2>
      <div id="queue"><div class="empty">Waiting for the first question…</div></div>
    </div>

    <div class="panel">
      <h2>Ask manually</h2>
      <textarea id="manual" placeholder="Type a question from the room…"></textarea>
      <div style="margin-top:8px;display:flex;gap:8px"><button class="primary" id="ask">Ask the models</button></div>
    </div>

    <div class="panel">
      <h2>Winners</h2>
      <div id="winners"><div class="empty">None yet.</div></div>
    </div>
  </aside>

  <section class="main">
    <div id="stage"><div class="hero-empty">Scan the QR code and ask a question about Anthropic's S-1 ⚡</div></div>
  </section>
</div>

<script type="module">
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const store = {
  get: (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch (e) { return d; } },
  set: (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
};
const cfg = await (await fetch("/api/config")).json();
let asked = new Set(store.get("s1b-asked", []));
let winners = store.get("s1b-winners", []);
let current = null;

// ---------------- wallet feed (read-only NWC connection, local only)
let questions = [];
async function startFeed() {
  if (!cfg.nwc) return;
  const { NWCClient } = await import("https://esm.sh/@getalby/sdk@9.0.0/nwc");
  const client = new NWCClient({ nostrWalletConnectUrl: cfg.nwc });
  const tick = async () => {
    try {
      const { transactions } = await client.listTransactions({ type: "incoming", limit: 100 });
      questions = transactions
        .filter(t => (t.state === "settled" || t.settled_at) && (t.description || "").startsWith("S1B|"))
        .map(t => {
          const [, who, ...rest] = t.description.split("|");
          return { id: t.payment_hash, who: who || "anon", text: rest.join("|"), at: t.settled_at || t.created_at };
        })
        .sort((a, b) => a.at - b.at);
      $("live").classList.add("live");
      renderQueue();
    } catch (e) { $("live").classList.remove("live"); }
  };
  tick(); setInterval(tick, 4000);
}

function renderQueue() {
  $("qcount").textContent = questions.length;
  $("queue").innerHTML = questions.length ? questions.map(q => `
    <div class="qitem ${asked.has(q.id) ? "asked" : ""}" data-id="${q.id}">
      <div class="who">${esc(q.who)}</div><div class="txt">${esc(q.text)}</div></div>`).join("")
    : `<div class="empty">${cfg.nwc ? "Waiting for the first question…" : "Wallet feed off (no NWC_STAGE). Use manual entry."}</div>`;
  document.querySelectorAll(".qitem").forEach(el => el.onclick = () => {
    const q = questions.find(x => x.id === el.dataset.id);
    asked.add(q.id); store.set("s1b-asked", [...asked]);
    renderQueue(); ask(q.text, q.who);
  });
}

// ---------------- asking
$("ask").onclick = () => { const t = $("manual").value.trim(); if (t) { ask(t, "from the room"); $("manual").value = ""; } };

async function ask(text, who) {
  const r = await fetch("/api/ask", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ question: text }) });
  const { job, error } = await r.json();
  if (error) return alert(error);
  current = { job, text, who };
  poll();
}

async function poll() {
  if (!current) return;
  const data = await (await fetch("/api/job/" + current.job)).json();
  renderStage(data);
  if (Object.values(data.results).some(r => r.status === "running")) setTimeout(poll, 1000);
}

function renderStage(data) {
  const elapsed = Math.round((Date.now() / 1000) - data.started);
  const cards = Object.values(data.results).map(r => {
    if (r.status === "running") return `<div class="card"><div class="name">${esc(r.label)}<div class="spinner"></div></div><div class="meta">reading 420 pages… ${elapsed}s</div></div>`;
    if (r.status === "error") return `<div class="card"><div class="name">${esc(r.label)}<span class="badge bad">error</span></div><div class="meta">${esc(r.error)}</div></div>`;
    const a = r.answer || {};
    const g = r.grounded == null ? `<span class="badge warn">no quote</span>`
      : r.grounded ? `<span class="badge ok">✓ quote is real</span>` : `<span class="badge bad">✗ quote not in filing</span>`;
    const nd = a.disclosed === false ? `<div class="warn" style="font-weight:600">Says: not disclosed</div>` : "";
    return `<div class="card">
      <div class="name">${esc(r.label)}${g}</div>
      ${nd}<div class="ans">${esc(a.answer || "(no answer)")}</div>
      ${a.quote ? `<div class="quote">"${esc(String(a.quote).slice(0, 320))}"${a.page ? ` · p. ${esc(a.page)}` : ""}</div>` : ""}
      <div class="meta">${r.latency_s ?? "–"}s · ${r.cost_usd != null ? "$" + r.cost_usd.toFixed(3) : "cost n/a"}</div></div>`;
  }).join("");
  $("stage").innerHTML = `
    <div class="meta">Question from <span style="color:var(--accent);font-weight:600">${esc(current.who)}</span> · ${esc(data.mode)} filing</div>
    <div class="question">${esc(data.question)}</div><div class="asker"></div>
    <div class="cards">${cards}</div>
    <div class="verdict">
      <button class="primary" id="stumped">Stumped! Pay the winner ⚡</button>
      <button id="held">Models held up</button>
    </div>`;
  $("stumped").onclick = () => {
    winners.push({ who: current.who, q: data.question, at: Date.now() });
    store.set("s1b-winners", winners); renderWinners();
    $("stumped").textContent = "Winner recorded. Scan their invoice in your wallet.";
  };
  $("held").onclick = () => { $("held").textContent = "✓ Logged"; };
}

function renderWinners() {
  $("winners").innerHTML = winners.length ? winners.map(w => `<div class="winner"><b>${esc(w.who)}</b><div class="meta">${esc(w.q.slice(0, 90))}</div></div>`).join("")
    : `<div class="empty">None yet.</div>`;
}

renderQueue(); renderWinners(); startFeed();
</script>
</body>
</html>
